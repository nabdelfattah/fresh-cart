<div
  class="flex flex-col sm:flex-row items-center gap-6 border border-gray-200 rounded-2xl p-5 bg-white shadow-sm"
>
  <!-- img  -->
  <div class="flex flex-col items-center gap-3 shrink-0">
    <div
      class="w-32 h-32 bg-gray-50 rounded-xl flex items-center justify-center border border-gray-100 overflow-hidden"
    >
      <img
        [src]="data().product.imageCover"
        [alt]="data().product.title"
        class="object-cover mix-blend-multiply"
      />
    </div>
    @if (data().product.quantity > 0) {
      <span
        class="bg-[#138D46] text-white text-2xs font-bold px-3 py-1 rounded-full flex items-center gap-1"
      >
        <i class="fa-solid fa-check"></i> In Stock
      </span>
    } @else {
      <span
        class="bg-red-500 text-white text-2xs font-bold px-3 py-1 rounded-full flex items-center gap-1"
      >
        <i class="fa-solid fa-x"></i> Out of Stock
      </span>
    }
  </div>

  <!-- product details  -->
  <div class="flex-1 w-full">
    <h3 class="font-bold text-xl text-gray-900">
      {{ data().product.title | trimTitle }}
    </h3>
    <div class="flex items-center gap-3 text-sm text-gray-500 mt-2">
      <span class="bg-green-50 text-[#138D46] px-3 py-1 rounded-full text-xs font-medium">{{
        data().product.category.name
      }}</span>
      <span class="text-gray-300">•</span>
      <span class="text-xs">SKU: {{ data().product.id | truncateId }}</span>
    </div>
    <div class="mt-4 font-bold text-[#138D46] text-xl">
      {{ data().price | currency: 'EGP' }}
      <span class="text-xs text-gray-400 font-normal">per unit</span>
    </div>
  </div>

  <!-- count & remove  -->
  <div class="flex items-center justify-between sm:justify-end gap-6 w-full sm:w-auto mt-4 sm:mt-0">
    <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden h-10">
      <button
        (click)="reduceCount(data().product, data().count)"
        class="px-3 h-full text-gray-500 hover:bg-gray-100 transition-colors focus:outline-hidden"
      >
        <i class="fa-solid fa-minus text-xs"></i>
      </button>

      <span class="px-3 font-bold text-gray-900 min-w-10 text-center">{{ data().count }}</span>

      <button
        (click)="increaseCount(data().product, data().count)"
        class="px-3 h-full bg-[#138D46] text-white hover:bg-green-700 transition-colors focus:outline-hidden"
      >
        <i class="fa-solid fa-plus text-xs"></i>
      </button>
    </div>

    <div class="text-right min-w-16">
      <div class="text-xs text-gray-400 mb-0.5">Total</div>
      <div class="font-bold text-xl text-gray-900">
        {{ data().count * data().price }} <span class="text-xs font-normal">EGP</span>
      </div>
    </div>

    <button
      (click)="removeItem(data().product.id)"
      class="w-10 h-10 cursor-pointer flex items-center justify-center bg-red-50 text-red-500 rounded-lg hover:bg-red-100 transition-colors focus:outline-hidden"
    >
      <i class="fa-regular fa-trash-can"></i>
    </button>
  </div>
</div>
