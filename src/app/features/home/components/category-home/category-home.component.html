<section class="p-10">
  <div class="container">
    <!-- header -->
    <app-section-header text="Shop By" greenText="Category" />

    <!-- cards -->
    <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4 mt-5">
      @for (category of categories(); track category._id) {
        <app-category-card [data]="category" />
      }
    </div>
  </div>
</section>
