<section class="p-10">
  <div class="container">
    <!-- header -->
    <app-section-header text="Featured" greenText="products" />

    <!-- cards -->
    <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 mt-5">
      @for (product of products(); track product._id) {
        <app-product-card [data]="product" />
      }
    </div>
  </div>
</section>
